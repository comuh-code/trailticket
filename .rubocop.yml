plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec
  - rubocop-factory_bot
  - rubocop-rspec_rails

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - bin/*
    - vendor/**/*
    - '**/tmp/**/*'
    - '**/log/**/*'
    - '**/coverage/**/*'
    - spec/dummy/db/**/*

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 100

Metrics/AbcSize:
  Max: 20

Style/ClassAndModuleChildren:
  EnforcedStyle: compact

RSpec/NestedGroups:
  Max: 5

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 30

RSpec/ExampleLength:
  Max: 30
