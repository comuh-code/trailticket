plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec
  - rubocop-factory_bot
  - rubocop-rspec_rails

AllCops:
  TargetRubyVersion: 3.1
  # The oldest Rails the gem supports, so cops never suggest Rails 8-only APIs.
  TargetRailsVersion: 7.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - bin/*
    - vendor/**/*
    - '**/tmp/**/*'
    - '**/log/**/*'
    - '**/coverage/**/*'
    - spec/dummy/db/**/*

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 100

Metrics/AbcSize:
  Max: 20
  Exclude:
    - db/migrate/*

# A create_table with every column is long by nature.
Metrics/MethodLength:
  Exclude:
    - db/migrate/*

Style/ClassAndModuleChildren:
  EnforcedStyle: compact

RSpec/NestedGroups:
  Max: 5

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 30

RSpec/ExampleLength:
  Max: 30
